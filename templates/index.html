<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Customer Behaviour Prediction Model</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 540px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        .header-banner {
            background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            padding: 28px 25px;
            text-align: center;
        }
        .header-banner h2 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }
        .header-banner p {
            margin: 8px 0 0;
            font-size: 13px;
            color: #a8dadc;
        }
        .form-body {
            padding: 30px;
        }
        label {
            font-weight: 600;
            color: #2b2d42;
            display: block;
            margin-top: 15px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #f8fafc;
            transition: border-color 0.3s, background-color 0.3s;
        }
        input:focus {
            border-color: #2a5298;
            background-color: #ffffff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00b09b, #96c93d);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 176, 155, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 176, 155, 0.45);
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            background-color: #f1f5f9;
            border-left: 6px solid #2a5298;
        }
        .result h3 {
            margin: 0 0 8px 0;
            color: #1e293b;
            font-size: 18px;
        }
        .result p {
            margin: 0;
            font-weight: 600;
            color: #475569;
        }
        .popup {
            margin-top: 15px;
            padding: 15px;
            background: linear-gradient(135deg, #fff3cd, #ffeeba);
            border: 2px solid #f59e0b;
            border-radius: 8px;
            color: #92400e;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-banner">
            <h2>E-commerce Customer Behaviour Prediction Model</h2>
            <p>Real-Time Machine Learning Conversion & Retention Engine</p>
        </div>
        
        <div class="form-body">
            <form method="POST">
                <label>Customer Age (Years):</label>
                <input type="number" name="age" value="23" required>

                <label>Weekly Login Frequency:</label>
                <input type="number" name="login_freq" value="1" required>

                <label>Average Session Duration (Seconds):</label>
                <input type="number" step="0.1" name="session_time" value="45" required>

                <label>Pages Viewed Per Session:</label>
                <input type="number" step="0.1" name="pages" value="2" required>

                <label>Cart Abandonment Rate (0 to 100%):</label>
                <input type="number" step="1" name="cart_abandon" value="90" required>

                <label>Total Past Purchases:</label>
                <input type="number" name="purchases" value="0" required>

                <button type="submit">Predict Customer Behaviour</button>
            </form>

            {% if prediction %}
            <div class="result">
                <h3>{{ prediction }}</h3>
                <p>{{ confidence }}</p>
                {% if popup %}
                <div class="popup">
                     AUTOMATED ACTION TRIGGERED: Deploying 15% Discount Coupon Banner to Save the Sale!
                </div>
                {% endif %}
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
