<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Behaviour Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 40px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 20px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .result { margin-top: 25px; padding: 15px; border-radius: 5px; background-color: #e9ecef; text-align: center; }
        .popup { margin-top: 15px; padding: 15px; background-color: #fff3cd; border: 2px solid #ffc107; border-radius: 5px; color: #856404; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2> Live Shopper Intent Predictor</h2>
        <form method="POST">
            <label>Customer Age (Years):</label>
            <input type="number" name="age" value="23" required>

            <label>Weekly Login Frequency:</label>
            <input type="number" name="login_freq" value="1" required>

            <label>Average Session Duration (Seconds):</label>
            <input type="number" step="0.1" name="session_time" value="45" required>

            <label>Pages Viewed Per Session:</label>
            <input type="number" step="0.1" name="pages" value="2" required>

            <label>Cart Abandonment Rate (0 to 100%):</label>
            <input type="number" step="1" name="cart_abandon" value="90" required>

            <label>Total Past Purchases:</label>
            <input type="number" name="purchases" value="0" required>

            <button type="submit">Predict Customer Behaviour</button>
        </form>

        {% if prediction %}
        <div class="result">
            <h3>{{ prediction }}</h3>
            <p>{{ confidence }}</p>
            {% if popup %}
            <div class="popup">
                AUTOMATED ACTION TRIGGERED: Deploying 15% Discount Coupon Banner to Save the Sale!
            </div>
            {% endif %}
        </div>
        {% endif %}
    </div>
</body>
</html>
